{% extends "base.html" %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto"><div class="card-body">
  <h1 class="card-title">Reset your password</h1>
  <p class="text-sm opacity-70">Enter your registered email and we'll send you a reset link.</p>
  <form method="post">{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="btn btn-primary w-full" type="submit">Send reset link</button>
  </form>
</div></div>
{% endblock %}
