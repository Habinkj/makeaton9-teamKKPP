{% extends "base.html" %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto"><div class="card-body">
  {% if validlink %}
    <h1 class="card-title">Choose a new password</h1>
    <form method="post">{% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary w-full" type="submit">Change password</button>
    </form>
  {% else %}
    <h1 class="card-title">Link expired</h1>
    <p>This reset link is invalid or has already been used.</p>
    <a class="link" href="{% url 'password_reset' %}">Request a new one</a>
  {% endif %}
</div></div>
{% endblock %}
