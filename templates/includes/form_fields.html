{% if form.non_field_errors %}
  <div class="alert alert-error mb-3">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <label class="form-control w-full mb-3">
    <div class="label"><span class="label-text">{{ field.label }}</span></div>
    {{ field }}
    {% for e in field.errors %}<div class="label"><span class="label-text-alt text-error">{{ e }}</span></div>{% endfor %}
  </label>
{% endfor %}
